<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SayatSays">
<meta name="theme-color" content="#E8ECF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E131A" media="(prefers-color-scheme: dark)">
<title>SayatSays</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./css/app.css">
<script>
  // Тема — до первой отрисовки, иначе при запуске мелькнёт светлая. Главная запись темы — в настройках (в базе),
  // а здесь её копия из localStorage: база открывается позже. Список тем — js/themes.js.
  try { var t = localStorage.getItem('sayatsays-theme'); if (t && t !== 'auto') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<script type="module" src="./js/app.js"></script>
</head>
<body>
<div id="app"><div class="empty"><p>Загружаю…</p></div></div>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
  // Если открыть index.html двойным щелчком (адрес file://), браузер не загрузит ни модули, ни data/*.json.
  if (location.protocol === 'file:') {
    document.getElementById('app').innerHTML = '<div class="empty"><p>Приложение нужно открыть через локальный сервер.</p>' +
      '<p>В папке проекта выполни <b>python -m http.server</b> и открой http://localhost:8000</p></div>';
  }
</script>
</body>
</html>
